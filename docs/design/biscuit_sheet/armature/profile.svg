<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0b0b0b"/>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- tail: standing, carried up and curved over the back, plume on the last third -->
    <path fill="#8a5230" d="M846 352 c 34 -22 60 -62 68 -108 c 6 -38 0 -70 -16 -90 l 40 -22 c 24 32 30 78 20 124 c -12 56 -46 100 -84 124 z"/>
    <path fill="#dda97b" d="M898 154 c -16 -20 -38 -28 -60 -22 c -14 4 -24 14 -26 26 c 18 -8 36 -6 50 2 c 12 6 22 16 28 28 z"/>

    <!-- far legs, set back -->
    <path fill="#6b3f22" d="M470 600 l0 200 l52 0 l0 -200 z"/>
    <path fill="#6b3f22" d="M782 600 l0 200 l52 0 l0 -200 z"/>

    <!-- body: a square compact barrel, withers to rump about equal to the height at the withers -->
    <path fill="#8a5230" d="M392 306
      c -40 6 -62 34 -66 76
      c -4 44 -2 128 4 174
      c 5 40 14 68 26 84
      l 452 0
      c 14 -18 22 -50 26 -92
      c 5 -50 5 -122 0 -164
      c -6 -46 -30 -74 -70 -78 z"/>

    <!-- near legs, cream from about the elbow and the hock down -->
    <path fill="#8a5230" d="M418 604 l0 70 l76 0 l0 -70 z"/>
    <path fill="#8a5230" d="M730 604 l0 70 l76 0 l0 -70 z"/>
    <path fill="#efd3b4" d="M420 668 c -6 66 -6 148 -2 198 c 3 34 8 56 14 66 c 6 12 18 18 32 18 c 14 0 26 -6 32 -18 c 6 -10 11 -32 14 -66 c 4 -50 4 -132 -2 -198 z"/>
    <path fill="#efd3b4" d="M732 668 c -6 66 -6 148 -2 198 c 3 34 8 56 14 66 c 6 12 18 18 32 18 c 14 0 26 -6 32 -18 c 6 -10 11 -32 14 -66 c 4 -50 4 -132 -2 -198 z"/>
    <path fill="#efd3b4" d="M406 896 c -12 30 -10 52 2 64 c 11 11 30 16 52 16 c 22 0 41 -5 52 -16 c 12 -12 14 -34 2 -64 z"/>
    <path fill="#efd3b4" d="M718 896 c -12 30 -10 52 2 64 c 11 11 30 16 52 16 c 22 0 41 -5 52 -16 c 12 -12 14 -34 2 -64 z"/>

    <!-- bib: throat and upper chest only -->
    <path fill="#efd3b4" d="M362 386 c -20 6 -32 26 -32 54 c 0 30 10 56 26 68 c 10 8 20 10 28 6 c 10 -6 16 -26 16 -56 c 0 -34 -12 -60 -38 -72 z"/>

    <!-- THE HEAD IS A CIRCLE. The construction circle spans x 205..415, diameter 210. -->
    <circle cx="310" cy="256" r="105" fill="#8a5230"/>

    <!-- THE MUZZLE IS A SHORT BLUNT STUB. It projects 62px past the circle: 0.30 of the diameter. -->
    <path fill="#efd3b4" d="M252 268
      c -40 2 -78 12 -96 26
      c -12 10 -14 22 -6 32
      c 10 12 34 20 62 22
      c 30 2 56 -4 70 -16 z"/>

    <!-- nose: large for the short muzzle, liver, at the very front of the stub -->
    <path fill="#a9663b" d="M162 282 c -14 0 -24 8 -24 20 c 0 13 12 22 26 22 c 14 0 24 -9 24 -22 c 0 -12 -12 -20 -26 -20 z"/>
    <path d="M158 330 q26 10 50 2" stroke-width="4" fill="none"/>

    <!-- the near ear: set LOW at eye level, one lobe reaching the jawline, the darkest value -->
    <path fill="#6b3f22" d="M330 250
      c -34 -4 -58 12 -66 44
      c -10 40 -8 96 2 128
      c 8 26 24 40 44 40
      c 22 0 38 -18 44 -50
      c 8 -44 8 -122 -24 -162 z"/>

    <!-- eye: round, open, level -->
    <circle cx="272" cy="240" r="15" fill="#c4834e"/>
    <circle cx="272" cy="240" r="7" fill="#3d2313" stroke="none"/>
    <!-- brow pip -->
    <ellipse cx="266" cy="200" rx="17" ry="9" fill="#efd3b4"/>

    <!-- a few open coat loops and nothing more -->
    <g fill="none" stroke-width="4">
      <path d="M560 430 q22 -14 40 4"/>
      <path d="M690 540 q24 -12 40 8"/>
      <path d="M330 170 q22 -18 44 -2"/>
    </g>
  </g>
</svg>
