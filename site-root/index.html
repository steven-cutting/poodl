<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biscuit Games</title>
    <meta
      name="description"
      content="Small, exacting games that run in your browser. No accounts, no telemetry, nothing kept anywhere else."
    />
    <link rel="icon" href="data:," />
    <!--
      The application's own tokens, copied here by scripts/stage_site.sh rather
      than restated. A second palette would sit outside the contrast gate that
      tests/contrast.test.ts holds over the first one. It carries the theme too:
      data-theme="dark" on the root pins the page to the dark palette — the
      default the app ships in its own markup — with no script to run, and no
      settings panel here to choose otherwise.

      Since decision 0010 it carries the two faces as well, and the staging
      copies them to the path the stylesheet names. If the page renders in the
      system sans, that copy is what is missing.
    -->
    <link rel="stylesheet" href="./app.css" />
    <style>
      /*
       * Layout only. Every colour, face, size and step below is a token
       * app.css already decided, which is what keeps this page inside the one
       * system rather than beside it: the figures it used to state itself —
       * 34rem, 1px, 1.5rem — are the tokens the app measures the same things
       * with, so the page moves when the system does.
       */
      .shell {
        max-inline-size: var(--shell-max);
        margin-inline: auto;
        padding: var(--s-8) var(--shell-pad) var(--s-11);
      }

      header {
        border-block-end: var(--rule-w) solid var(--rule);
        padding-block-end: var(--s-5);
        margin-block-end: var(--s-8);
      }

      /*
       * The brand's own setting, as `Wordmark` sets it in the app: the display
       * face, lowercase, tight. The name stays capitalised in the markup, so
       * the title, the accessible name and the search snippet read as a name
       * while the page shows the wordmark's case.
       *
       * The mark itself is deliberately not drawn here. Decision 0009 keeps
       * this page to a name, a sentence and a link, and a second rendering of
       * a placeholder lockup is exactly the growth that would reopen it.
       */
      h1 {
        margin: 0;
        color: var(--text);
        font-family: var(--font-display);
        font-size: var(--fs-display-3);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: var(--track-display);
        text-transform: lowercase;
      }

      .tagline {
        margin: var(--s-4) 0 0;
        color: var(--text-2);
        font-size: var(--fs-body);
      }

      .games {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .games a {
        color: var(--text);
        font-family: var(--font-display);
        font-size: var(--fs-title);
        font-weight: 600;
        letter-spacing: var(--track-title);
      }

      .games p {
        margin: var(--s-2) 0 0;
        color: var(--text-2);
        font-size: var(--fs-body);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Biscuit Games</h1>
        <p class="tagline">
          Small, exacting games that run in your browser. No accounts, no telemetry, nothing kept
          anywhere else.
        </p>
      </header>
      <main>
        <!--
          Relative, never rooted. During the move to this domain the same files
          are served one level deeper for a few minutes, and a relative link is
          what makes that window harmless rather than a loop back to this page.
        -->
        <ul class="games">
          <li>
            <a href="./poodl/">Poodl</a>
            <p>Guess a five-letter word in six attempts, as many times as you like.</p>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
