<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biscuit Games</title>
    <meta
      name="description"
      content="Small, exacting games that run in your browser. No accounts, no telemetry, nothing kept anywhere else."
    />
    <link rel="icon" href="data:," />
    <!--
      The application's own tokens, copied here by scripts/stage_site.sh rather
      than restated. A second palette would sit outside the contrast gate that
      tests/contrast.test.ts holds over the first one. It carries the theme too:
      the light and dark blocks answer the device with no script to run.
    -->
    <link rel="stylesheet" href="./app.css" />
    <style>
      /* Layout only. Every colour below is a token app.css already decided. */
      .shell {
        max-inline-size: 34rem;
        margin-inline: auto;
        padding: 1.5rem 1rem 3rem;
      }

      header {
        border-block-end: 1px solid var(--tile-border);
        padding-block-end: 0.75rem;
        margin-block-end: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .tagline {
        margin: 0.5rem 0 0;
        color: var(--muted);
      }

      .games {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .games a {
        font-size: 1.25rem;
        color: var(--text);
      }

      .games p {
        margin: 0.25rem 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Biscuit Games</h1>
        <p class="tagline">
          Small, exacting games that run in your browser. No accounts, no telemetry, nothing kept
          anywhere else.
        </p>
      </header>
      <main>
        <!--
          Relative, never rooted. During the move to this domain the same files
          are served one level deeper for a few minutes, and a relative link is
          what makes that window harmless rather than a loop back to this page.
        -->
        <ul class="games">
          <li>
            <a href="./poodl/">Poodl</a>
            <p>Guess a five-letter word in six attempts, as many times as you like.</p>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
