name: Deploy to GitHub Pages

# Publishing needs write scopes that no other workflow here has, so the deploy
# lives in its own file rather than as a job on the end of CI.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Where Poodl sits inside its own domain, and it is a decision rather than a
# constraint. This repository owns pnut.fans, so Pages serves it from the root
# of that domain; the root is a landing page and the game lives beneath it. See
# decision 0009. Both the build and the staging read this, which is what keeps
# `paths.base` and the directory the build is moved into from drifting apart.
env:
  BASE_PATH: /poodl

# One deployment at a time, and never cancel one that is already running: a
# half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit
      - name: Build the static site
        run: npm run build
      - name: Stage the domain root around it
        run: npm run stage
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # The whole domain, not just the app: site/ is the landing page with
          # the build moved in beneath it at BASE_PATH.
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
