# Mutating counterpart to .pre-commit-config.yaml. Never installed as a hook;
# run it explicitly with `just fix`.
exclude: >-
  (?x)^(
    \.git/|
    \.svelte-kit/|
    \.venv/|
    ai_tmp/|
    build/|
    coverage/|
    node_modules/|
    src/lib/data/|
    uv\.lock$|
    package-lock\.json$
  )
repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: Ruff autofix
        entry: uv run --frozen ruff check --fix-only --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]

  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint fix
        args: [--fix]
